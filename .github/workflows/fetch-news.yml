name: Fetch Jimin News

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          path: public-repo

      - name: Checkout private repo (via deploy key)
        uses: actions/checkout@v4
        with:
          repository: USERNAME/jimin-news-private
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          path: private-repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: private-repo
        run: npm install

      - name: Run fetch script
        working-directory: private-repo
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DATA_PATH: ../public-repo/data.json
        run: node fetch.js

      - name: Commit & push data.json
        working-directory: public-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "Tidak ada perubahan" || git commit -m "Update jimin news data"
          git push
